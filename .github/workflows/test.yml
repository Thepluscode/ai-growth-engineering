name: test
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_tree.py --selftest
      - run: python scripts/build_tree.py --check
      - run: python scripts/scope_gate.py --selftest
      - run: python scripts/scope_gate.py
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
