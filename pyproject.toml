[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-growth-engineering"
version = "0.1.0"
description = "Evidence-driven operating system for AI Growth Engineering"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "ThePlus-Tech"}]
dependencies = []

[project.scripts]
age = "ai_growth_engineering.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
