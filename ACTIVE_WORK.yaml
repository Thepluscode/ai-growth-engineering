# The authoritative current task. This file decides what gets worked on.
#
# No counts, SHAs or experiment figures live here — they change, and a stale number in an
# authority file is worse than no number. They are generated into docs/STATE.json by
# `make snapshot` and read from there.
#
# Changing `active` requires one of the conditions in `task_switch_requires` below, and
# the switch is recorded in `history`. Discovery is not authorisation.

schema: age-active-work.v1
project: ai-growth-engineering
canonical_path: ~/projects/ai/ai-growth-engineering

active:
  task: market_hypothesis_layer
  priority: P3
  status: ACTIVE
  approved_by: founder
  started_at: 2026-09-26
  definition: >
    Markets become first-class objects with evidenced fields only. Experiments reference a
    market, and evidence is held in five independent layers - RESEARCH, ACCESS, DEMAND,
    COMMERCIAL, PAID - never inferred from one another. Comparing two markets returns
    NOT_ENOUGH_EVIDENCE unless the same layer is tested in both on a comparable basis.
  done_when:
    - a market registry exists with per-layer evidence derived from recorded experiments
    - a comparison never pools experiments of different layers or protocols
    - the comparison returns NOT_ENOUGH_EVIDENCE when either side lacks the layer
    - the engine stays market-neutral under scripts/scope_gate.py
