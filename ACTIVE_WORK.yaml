# The authoritative current task. This file decides what gets worked on.
#
# No counts, SHAs or experiment figures live here — they change, and a stale number in an
# authority file is worse than no number. They are generated into docs/STATE.json by
# `make snapshot` and read from there.
#
# Changing `active` requires one of the conditions in `task_switch_requires` below, and
# the switch is recorded in `history`. Discovery is not authorisation.

schema: age-active-work.v1
project: ai-growth-engineering
canonical_path: ~/projects/ai/ai-growth-engineering

active:
  task: continuity_reference_implementation
  priority: P3
  status: ACTIVE
  approved_by: founder
  started_at: 2026-09-20
  definition: >
    Make this repository the reference implementation of the ThePlus continuity contract:
    thin CLAUDE.md, stable AGENT_CONTEXT.md, this file, generated docs/STATE.json, a
    bounded PARKING_LOT.md, and a preflight that can prove all of them.
  done_when:
    - a fresh session entering the canonical repo recovers mission, task and gates
      without reading any prior conversation
    - preflight exits 0 on a healthy canonical checkout
    - preflight exits non-zero on the deviated path, on missing ACTIVE_WORK, and on
      stale or unprovable generated state

completed:
  - task: age_canonical_integrity_hardening
    closed_at: 2026-09-20
    result: >
      All ten independently confirmed integrity findings verified by mutation against a
      green baseline. Zero OPEN. The tenth gap — staged-verdict cross-experiment
      isolation — was test coverage, not a production defect.
  - task: theplus_continuity_bootstrap
    closed_at: 2026-09-20
