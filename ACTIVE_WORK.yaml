# The authoritative current task. This file decides what gets worked on.
#
# No counts, SHAs or experiment figures live here — they change, and a stale number in an
# authority file is worse than no number. They are generated into docs/STATE.json by
# `make snapshot` and read from there.
#
# Changing `active` requires one of the conditions in `task_switch_requires` below, and
# the switch is recorded in `history`. Discovery is not authorisation.

schema: age-active-work.v1
project: ai-growth-engineering
canonical_path: ~/projects/ai/ai-growth-engineering

active:
  task: weekly_marketing_cycle_v1
  priority: P0
  status: ACTIVE
  approved_by: founder
  started_at: 2026-09-27
  due: 2026-10-11
  definition: >
    The Marketing Engineer markets ThePlus-Tech products, not one offer. Three product
    markets run one weekly cycle: research named buyers, draft in the workbench tagged with
    the market's experiment, founder approves and sends by hand, record sends and replies,
    `age week` reports each market's distance from a measurable sample and what the
    cross-market comparison allows. Feature work outside this cycle is parked.
  done_when:
    - each of the three markets is registered with a DEMAND experiment and tagged drafts
      are credited to it end to end (draft, approve, send, reply, readout)
    - `age week` runs on the real store and names this week's work per market
    - one full weekly cycle has run on real buyers (the founder sends; the system never does)
