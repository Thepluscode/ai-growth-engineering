# The authoritative current task. This file decides what gets worked on.
#
# No counts, SHAs or experiment figures live here — they change, and a stale number in an
# authority file is worse than no number. They are generated into docs/STATE.json by
# `make snapshot` and read from there.
#
# Changing `active` requires one of the conditions in `task_switch_requires` below, and
# the switch is recorded in `history`. Discovery is not authorisation.

schema: age-active-work.v1
project: ai-growth-engineering
canonical_path: ~/projects/ai/ai-growth-engineering

active:
  task: sessionstart_hook_design
  priority: P3
  status: ACTIVE
  approved_by: founder
  started_at: 2026-09-26
  definition: >
    Design only. Specify how preflight runs at session start: enforcement in migrated
    repositories, advisory in the rest, and how a repository proves it is migrated.
    Installation is a separate founder decision and is not part of this task.
  done_when:
    - a written design names the trigger, the migrated/unmigrated test, the exit-code
      contract, the bypass, and what a failed check shows the session
    - the design states how advisory mode is retired when migration completes
    - nothing is installed into any settings file or hook directory
completed:
  - task: continuity_reference_implementation
    closed_at: 2026-09-26
    result: >
      A fresh session recovered mission, task and gates from the repository alone;
      preflight exits 0 on the healthy canonical checkout and fails closed on the
      deviated path, missing ACTIVE_WORK and stale or unprovable state, each under test.
  - task: age_canonical_integrity_hardening
    closed_at: 2026-09-20
    result: >
      All ten independently confirmed integrity findings verified by mutation against a
      green baseline. Zero OPEN. The tenth gap — staged-verdict cross-experiment
      isolation — was test coverage, not a production defect.
  - task: theplus_continuity_bootstrap
    closed_at: 2026-09-20
    result: >
      Global source-of-truth precedence, four continuity invariants, P0-P6 priority model
      and a fail-closed preflight. Committed and pushed in theplus-tech-knowledge.

